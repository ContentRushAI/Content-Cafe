<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Cafe - Drinks</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:15px;
}

.brand-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:20px;
}

.logo{
    width:60px;
    height:60px;
    object-fit:contain;
}

.cafe-name{
    font-size:36px;
    font-weight:700;
    color:#D4AF37;
}

.category-title{
    text-align:center;
    font-size:26px;
    font-weight:700;
    color:#fff;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#111;
    border:1px solid #D4AF37;
}

th{
    font-size:20px;
    padding:10px 5px;
    color:#D4AF37;
    border-bottom:1px solid #D4AF37;
    text-align:center;
}

td{
    font-size:18px;
    padding:10px 5px;
    border-bottom:1px solid #333;
    text-align:center;
}

td:first-child{
    text-align:left;
    font-weight:600;
}

.view-btn{
    display:inline-block;
    text-decoration:none;
    font-size:18px;
    padding:4px 10px;
    border-radius:4px;
    background:#D4AF37;
    color:#000;
    font-weight:700;
}
</style>

</head>
<body>

<div class="brand-row">
    <img src="logo.png" alt="Logo" class="logo">
    <div class="cafe-name">Content Cafe</div>
</div>

<div class="category-title">
    Drinks
</div>

<table>

<thead>
<tr>
    <th>Item Name</th>
    <th>Price</th>
    <th>3D</th>
</tr>
</thead>

<tbody>

<tr>
    <td>Mojito</td>
    <td>₹150</td>
    <td><a href="mojito.html" class="view-btn">View</a></td>
</tr>

<tr>
    <td>Strawbery Mojito</td>
    <td>₹160</td>
    <td><a href="strawbery-mojito.html" class="view-btn">View</a></td>
</tr>

<tr>
    <td>Cold Coffee</td>
    <td>₹200</td>
    <td><a href="cold-coffee.html" class="view-btn">View</a></td>
</tr>

<tr>
    <td>Milk Shake</td>
    <td>₹200</td>
    <td><a href="milk-shake.html" class="view-btn">View</a></td>
</tr>

<tr>
    <td>Cold Drink Can</td>
    <td>MRP</td>
    <td>--</td>
</tr>

<tr>
    <td>Water Bottle</td>
    <td>MRP</td>
    <td>--</td>
</tr>

</tbody>

</table>

</body>
</html>
