<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dal Tadka - Content Cafe</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:15px;
}

.brand-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:25px;
}

.logo{
    width:60px;
    height:60px;
    object-fit:contain;
}

.cafe-name{
    font-size:36px;
    font-weight:700;
    color:#D4AF37;
}

.item-details{
    margin-bottom:20px;
}

.detail-row{
    text-align:left;
    margin-bottom:6px;
    font-size:14px;
}

.label{
    color:#D4AF37;
    font-weight:700;
}

.value{
    color:#FFFFFF;
    font-weight:600;
}

model-viewer{
    width:100%;
    height:450px;
    background:#111;
    border:1px solid #D4AF37;
    border-radius:10px;
    margin-top:20px;
}

.button-container{
    text-align:center;
    margin-top:20px;
}

.ar-btn{
    background:#D4AF37;
    color:#000;
    border:none;
    padding:14px 30px;
    font-size:20px;
    font-weight:700;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="brand-row">
    <img src="logo.png" alt="Logo" class="logo">
    <div class="cafe-name">Content Cafe</div>
</div>

<div class="item-details">

    <div class="detail-row">
        <span class="label">Item Name:</span>
        <span class="value">Dal Tadka</span>
    </div>

    <div class="detail-row">
        <span class="label">Half:</span>
        <span class="value">₹200</span>
    </div>

    <div class="detail-row">
        <span class="label">Full:</span>
        <span class="value">₹300</span>
    </div>

</div>

<model-viewer
    src="dal-tadka.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate>
</model-viewer>

<div class="button-container">
    <button class="ar-btn" onclick="document.querySelector('model-viewer').activateAR()">
        View in 3D
    </button>
</div>

</body>
</html>
