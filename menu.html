<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Cafe Menu</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    font-family:Arial,sans-serif;
    color:white;
    padding:15px;
}

.logo{
    width:90px;
    height:90px;

    display:block;
    margin:auto;
}

.cafe-name{
    text-align:center;
    font-size:36px;

    color:#D4AF37;

}

.menu-heading{
    text-align:center;
    font-size:30px;
    font-weight:700;
    color:white;
    margin:25px 0;
}

.category-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    text-decoration:none;
    color:white;
    background:#111;
    border:1px solid #D4AF37;
    border-radius:10px;
    padding:18px;
    margin-bottom:12px;
}

.category-name{
    font-size:26px;
    font-weight:600;
}

.item-count{
    font-size:18px;
    font-weight:700;
    color:#D4AF37;
}
</style>
</head>
<body>

<img src="logo.png" class="logo">

<div class="cafe-name">
    Content Cafe
</div>

<div class="menu-heading">
