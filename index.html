<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Cafe</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#000;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    text-align:center;
}

.brand-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:20px;
}

.logo{
    width:60px;
    height:60px;
    object-fit:contain;
}

.cafe-name{
    font-size:36px;
    font-weight:700;
    color:#D4AF37;
}

.contentrush{
    font-size:22px;
    color:#D4AF37;
    font-weight:700;
    margin-bottom:15px;
}

.status{
    font-size:24px;
    margin-bottom:15px;
}

.message{
    font-size:16px;
    line-height:1.6;
}
</style>

</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<div class="brand">Content Cafe</div>

<div id="content"></div>

</div>

<script>

const subscription = true;

if(subscription){

window.location.href = "menu.html";

}else{

document.getElementById("content").innerHTML = `
<div class="status">
Your Session has expired. Please Subscribe to continue viewing Menu
</div>

<div style="
margin-top:20px;
font-size:22px;
font-weight:700;
color:#00BFFF;
">
Powered by ContentRush.AI
</div>
`;

}

</script>


</body>
</html>
</html>
