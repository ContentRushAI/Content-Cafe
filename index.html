<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Cafe</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#000;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    text-align:center;
}

.logo{
    width:120px;
    height:120px;
    object-fit:contain;
    margin-bottom:15px;
}

.cafe-name{
    font-size:36px;
    font-weight:700;
    color:#D4AF37;
    margin-bottom:20px;
}

.status{
    font-size:22px;
    margin-bottom:20px;
}

.enter-btn{
    display:inline-block;
    text-decoration:none;
    background:#D4AF37;
    color:#000;
    font-size:18px;
    font-weight:700;
    padding:14px 40px;
    border-radius:8px;
}

.contentrush{
    font-size:22px;
    color:#D4AF37;
    font-weight:700;
    margin-bottom:15px;
}

.message{
    font-size:16px;
    line-height:1.6;
    color:#fff;
}

</style>
</head>
<body>

<div class="container">

    <!-- Restaurant Logo -->
    <img src="logo.png" alt="Logo" class="logo">

    <!-- Restaurant Name -->
    <div class="cafe-name">
        Content Cafe
    </div>

    <!-- ACTIVE PAGE -->
    <div id="activePage" style="display:none;">

        <div class="status">
            Subscription Active
        </div>

        <a href="menu.html" class="enter-btn">
            Enter Menu
        </a>

    </div>

    <!-- EXPIRED PAGE -->
    <div id="expiredPage" style="display:none;">

        <div class="contentrush">
            ContentRush.AI
        </div>

        <div class="status">
            Subscription Expired
        </div>

        <div class="message">
            Please renew your subscription
            to access the digital menu.
        </div>

    </div>

</div>

<script>

/* ==========================
   SUBSCRIPTION CONTROL
   ==========================

   true  = Menu Accessible
   false = Subscription Expired

========================== */

const subscriptionActive = true;

/* Change to false after trial */

if(subscriptionActive){

    document.getElementById("activePage").style.display = "block";

}else{

    document.getElementById("expiredPage").style.display = "block";

}

</script>

</body>
</html>
