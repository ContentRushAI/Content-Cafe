<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Cafe</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#000;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    text-align:center;
}

.logo{
    width:120px;
    height:120px;
    object-fit:contain;
    margin-bottom:15px;
}

.cafe-name{
    font-size:36px;
    font-weight:700;
    color:#D4AF37;
    margin-bottom:20px;
}

.contentrush{
    font-size:22px;
    color:#D4AF37;
    font-weight:700;
    margin-bottom:15px;
}

.status{
    font-size:24px;
    margin-bottom:15px;
}

.message{
    font-size:16px;
    line-height:1.6;
}
</style>
</head>
<body>

<div class="container">

 <div class="brand-row">

    <img src="logo.png" alt="Logo" class="logo">

    <div class="cafe-name">
        Content Cafe
    </div>

</div>

    <div class="contentrush">
        ContentRush.AI
    </div>

    <div class="status">
        Subscription Expired
    </div>

    <div class="message">
        Please renew your subscription
        to access the digital menu.
    </div>

</div>

<script>

/* ==========================
   SUBSCRIPTION CONTROL
========================== */

const subscriptionActive = true;

/* true  = Open Menu
   false = Show Expired Page */

if(subscriptionActive){

    window.location.href = "menu.html";

}

</script>

</body>
</html>
